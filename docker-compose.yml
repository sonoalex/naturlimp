services:
  web:
    build:
      context: .
      target: dev
    ports:
      - "4321:4321"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    tty: true
    stdin_open: true
